<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@shangallego</title>

    <link rel="icon" href="icon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="viewer" id="viewer">
        <div class="loading" id="loading">
            Loading portfolio...
        </div>

        <div class="slide">
            <canvas id="pdfCanvas"></canvas>
        </div>

        <div class="click-area left" id="previousArea"></div>
        <div class="click-area right" id="nextArea"></div>

        <nav class="navigation" id="navigation">
            <div class="nav-links">
                <a href="Resume.pdf" download>Resume</a>
                <button id="emailButton">Email</button>
                <a href="https://instagram.com/shangallego" target="_blank" rel="noopener noreferrer">Instagram</a>
            </div>

            <div class="page-number" id="pageNumber">
                01 / 12
            </div>

            <div class="page-controls">
                <button id="previous" aria-label="Previous page">←</button>
                <button id="next" aria-label="Next page">→</button>
            </div>
        </nav>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
    <script src="script.js" type="module"></script>

</body>
</html>
